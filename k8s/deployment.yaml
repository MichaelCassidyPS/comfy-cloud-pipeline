apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoodie-api
  labels:
    app: hoodie-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hoodie-api
  template:
    metadata:
      labels:
        app: hoodie-api
    spec:
      containers:
        - name: hoodie-api
          image: <IMAGE_URI>          # patched at deploy time
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hoodie-api
spec:
  selector:
    app: hoodie-api
  ports:
    - port: 8000
      targetPort: 8080
  type: ClusterIP
